<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="Transfert de fichiers P2P en direct dans le navigateur sans limite et en toute confidentialité." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>DropP2P - Transfert de Fichiers P2P</title>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased min-h-screen selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
